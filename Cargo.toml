[package]
name = "reel"
version = "0.1.0"
edition = "2024"

[dependencies]
adblock = { version = "0.13.5", default-features = false, features = ["content-blocking"] }
futures-channel = "0.3"
gtk = "0.18"
serde_json = "1.0.154"
soup3 = "0.5"
webkit2gtk = { version = "2", features = ["v2_40"] }
webkit2gtk-sys = { version = "2", features = ["v2_40"] }
wry = { version = "0.57.1", default-features = false, features = ["os-webview"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
